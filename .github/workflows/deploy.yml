name: CD - deploy server-team

on:
  push:
    branches: [preview, test, staging]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target environment'
        type: choice
        options: [UAT, TEST, PROD, STAGING]
        default: UAT

concurrency:
  # Repo-wide group: all targets share one working tree (container for UAT/PROD,
  # stage host for TEST), so deploys must serialize regardless of target/branch.
  group: cd-server-team
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy
    runs-on: [self-hosted, drumee-in]
    timeout-minutes: 15
    env:
      SGP_USER: debian
      SGP_HOST: sgp
      CONTAINER: drumee
      REPO_PATH: /usr/src/drumee/server-team
      LOG_FILE: /tmp/cd-server-${{ github.run_id }}.log
    steps:
      - name: Resolve target
        id: target
        run: |
          if [ "${{ github.event_name }}" = "push" ]; then
            case "${{ github.ref_name }}" in
              test)    TARGET=TEST ;;
              preview) TARGET=UAT ;;
              staging) TARGET=STAGING ;;
              *) echo "Unsupported push branch: ${{ github.ref_name }}"; exit 1 ;;
            esac
          else
            TARGET="${{ github.event.inputs.target || 'UAT' }}"
          fi
          # MODE=stage  -> deploy locally on the runner host (drumee.in), endpoint `main` (native pm2)
          # MODE=container -> deploy into the prod box (sgp) docker container
          case "$TARGET" in
            PROD) ENV_FILE=production; EP=main;    PORT=24000; BRANCH=main; MODE=container ;;
            TEST) ENV_FILE=deploy;     EP=main;    PORT=24000; BRANCH=test;    MODE=stage ;;
            UAT)  ENV_FILE=deploy;     EP=preview; PORT=24001; BRANCH=preview; MODE=container ;;
            STAGING) ENV_FILE=production; EP=main; PORT=24000; BRANCH=staging; MODE=container ;;
            *) echo "Unknown target: $TARGET"; exit 1 ;;
          esac
          if [ "$TARGET" = "STAGING" ]; then
            echo "SGP_HOST=vps-1b631265.vps.ovh.net" >> "$GITHUB_ENV"
            echo "CONTAINER=drumee-uat" >> "$GITHUB_ENV"
          fi
          echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"
          echo "endpoint=$EP"       >> "$GITHUB_OUTPUT"
          echo "port=$PORT"         >> "$GITHUB_OUTPUT"
          echo "branch=$BRANCH"     >> "$GITHUB_OUTPUT"
          echo "mode=$MODE"         >> "$GITHUB_OUTPUT"
          echo "target=$TARGET"     >> "$GITHUB_OUTPUT"
          echo "::notice::Target $TARGET -> endpoint $EP (branch $BRANCH, mode $MODE)"

      # ---------------- TEST: deploy to drumee.in (stage) `main` endpoint, native ----------------
      - name: Deploy to stage main (TEST)
        id: stage
        if: steps.target.outputs.mode == 'stage'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO_DIR: /usr/src/drumee/server-team
        run: |
          set -euo pipefail
          AUTH="https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git"
          [ -d "$REPO_DIR/.git" ] || sudo git init -q "$REPO_DIR"
          PREV=$(sudo git -C "$REPO_DIR" rev-parse HEAD 2>/dev/null || echo "")
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          sudo git -C "$REPO_DIR" fetch --depth 1 "$AUTH" test
          sudo git -C "$REPO_DIR" checkout -f -B test FETCH_HEAD
          sudo git -C "$REPO_DIR" reset --hard FETCH_HEAD
          sudo git -C "$REPO_DIR" clean -fd -e .dev-tools.rc || true
          # Change summary for the Telegram notification (best effort — PREV may
          # be missing from the shallow history on a fresh runner).
          NEW=$(sudo git -C "$REPO_DIR" rev-parse HEAD)
          echo "new=$NEW" >> "$GITHUB_OUTPUT"
          CHANGES=""; IMPACT=""
          if [ -n "$PREV" ] && sudo git -C "$REPO_DIR" cat-file -e "$PREV" 2>/dev/null; then
            FILES=$(sudo git -C "$REPO_DIR" diff --name-only "$PREV" "$NEW" | wc -l | tr -d ' ')
            COMMITS=$(sudo git -C "$REPO_DIR" rev-list --count "$PREV..$NEW" 2>/dev/null || echo "")
            if [ -n "$COMMITS" ]; then CHANGES="$COMMITS commits · $FILES files"; else CHANGES="$FILES files"; fi
            IMPACT=$(sudo git -C "$REPO_DIR" diff --name-only "$PREV" "$NEW" \
              | awk -F/ '{ if (NF>1) print $1"/"$2; else print $1 }' \
              | sort | uniq -c | sort -rn | head -4 | awk '{print $2}' | paste -sd ', ' -)
          fi
          echo "changes=$CHANGES" >> "$GITHUB_OUTPUT"
          echo "impact=$IMPACT"   >> "$GITHUB_OUTPUT"
          echo "Deploying $(sudo git -C "$REPO_DIR" rev-parse --short HEAD) to stage main"
          sudo bash -c "cd '$REPO_DIR' && npm install --no-audit --no-fund"
          sudo bash -c "cd '$REPO_DIR' && npm run deploy -- deploy"
          sudo /usr/sbin/drumee start main
          sudo /usr/sbin/drumee start main/service
          # Offline workers run as separate pm2 apps and keep old code in
          # memory until restarted. Their names vary per host (indexWorker,
          # gdrive-worker, ...), so discover every running app whose name
          # contains "worker" instead of hardcoding a list. /usr/sbin/drumee
          # always exits 0, so echoes are informational only.
          WORKERS=$(sudo /usr/sbin/drumee jlist | grep -oiE '"name":"[^"]*worker[^"]*"' | cut -d'"' -f4 | sort -u || true)
          [ -n "$WORKERS" ] || echo "no offline workers running"
          for W in $WORKERS; do
            sudo /usr/sbin/drumee restart "$W" > /dev/null
            echo "worker $W restarted"
          done

      - name: Verify stage main (TEST)
        if: steps.target.outputs.mode == 'stage'
        run: |
          set -euo pipefail
          sleep 6
          CODE=$(curl -sk -o /dev/null -w '%{http_code}' --max-time 10 -H 'Host: drumee.in' https://localhost/-/ || echo 000)
          echo "stage main HTTP: $CODE"
          [[ "$CODE" =~ ^[2-4][0-9][0-9]$ ]] || { echo "::error::stage main verify failed ($CODE)"; exit 1; }
          echo "Verified stage main (server-team test)"

      - name: Rollback stage (on failure)
        id: rollback_stage
        if: failure() && steps.target.outputs.mode == 'stage' && steps.stage.outputs.prev != ''
        env:
          REPO_DIR: /usr/src/drumee/server-team
          PREV: ${{ steps.stage.outputs.prev }}
        run: |
          set -uo pipefail
          echo "::warning::Rolling back stage main to ${PREV:0:8}"
          sudo git -C "$REPO_DIR" reset --hard "$PREV"
          sudo bash -c "cd '$REPO_DIR' && npm run deploy -- deploy" || true
          sudo /usr/sbin/drumee start main || true
          sudo /usr/sbin/drumee start main/service || true
          WORKERS=$(sudo /usr/sbin/drumee jlist | grep -oiE '"name":"[^"]*worker[^"]*"' | cut -d'"' -f4 | sort -u || true)
          for W in $WORKERS; do
            sudo /usr/sbin/drumee restart "$W" || true
          done

      # ---------------- UAT / PROD: deploy into prod box (sgp) container ----------------
      - name: Fetch and reset working tree
        id: fetch
        if: steps.target.outputs.mode == 'container'
        env:
          BRANCH: ${{ steps.target.outputs.branch }}
        run: |
          OUTPUT=$(ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH
          PREV=\$(git rev-parse HEAD)
          echo "PREV=\$PREV"
          git fetch origin $BRANCH --quiet
          git checkout -f $BRANCH --quiet
          git reset --hard origin/$BRANCH --quiet
          git clean -fd --quiet >/dev/null 2>&1 || true
          NEW=\$(git rev-parse HEAD)
          echo "NEW=\$NEW"
          CHANGES=""; IMPACT=""
          if git cat-file -e "\$PREV" 2>/dev/null; then
            FILES=\$(git diff --name-only "\$PREV" "\$NEW" | wc -l | tr -d ' ')
            COMMITS=\$(git rev-list --count "\$PREV..\$NEW" 2>/dev/null || echo "")
            if [ -n "\$COMMITS" ]; then CHANGES="\$COMMITS commits · \$FILES files"; else CHANGES="\$FILES files"; fi
            IMPACT=\$(git diff --name-only "\$PREV" "\$NEW" \
              | awk -F/ '{ if (NF>1) print \$1"/"\$2; else print \$1 }' \
              | sort | uniq -c | sort -rn | head -4 | awk '{print \$2}' | paste -sd ', ' -)
          fi
          echo "CHANGES=\$CHANGES"
          echo "IMPACT=\$IMPACT"
          EOSSH
          )
          PREV=$(echo "$OUTPUT" | grep '^PREV=' | cut -d= -f2)
          NEW=$(echo "$OUTPUT"  | grep '^NEW='  | cut -d= -f2)
          CHANGES=$(echo "$OUTPUT" | grep '^CHANGES=' | cut -d= -f2- || true)
          IMPACT=$(echo "$OUTPUT"  | grep '^IMPACT='  | cut -d= -f2- || true)
          echo "prev=$PREV" >> "$GITHUB_OUTPUT"
          echo "new=$NEW"   >> "$GITHUB_OUTPUT"
          echo "changes=$CHANGES" >> "$GITHUB_OUTPUT"
          echo "impact=$IMPACT"   >> "$GITHUB_OUTPUT"
          echo "Previous: ${PREV:0:8}"
          echo "New     : ${NEW:0:8}"

      - name: Install dependencies
        if: steps.target.outputs.mode == 'container'
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH
          if ! npm install --no-audit --no-fund > $LOG_FILE 2>&1; then
            echo "::error::npm install failed. Tail of log:"
            tail -50 $LOG_FILE
            exit 1
          fi
          echo "Dependencies installed"
          EOSSH

      - name: Deploy
        if: steps.target.outputs.mode == 'container'
        env:
          ENV_FILE: ${{ steps.target.outputs.env_file }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH
          if ! npm run deploy -- $ENV_FILE > $LOG_FILE 2>&1; then
            echo "::error::Deploy command failed. Tail of log:"
            tail -50 $LOG_FILE
            exit 1
          fi
          echo "Deploy succeeded"
          EOSSH

      - name: Start services
        if: steps.target.outputs.mode == 'container'
        env:
          EP: ${{ steps.target.outputs.endpoint }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          /usr/sbin/drumee start $EP         >> $LOG_FILE 2>&1
          /usr/sbin/drumee start $EP/service >> $LOG_FILE 2>&1
          echo "drumee start issued for $EP and $EP/service"
          # Offline workers (indexing, gdrive migration, trash/expiry/...) are
          # separate pm2 apps shared by the container; restart them so they
          # pick up the deployed code instead of keeping the old build in RAM.
          # Names vary per host, so discover running apps matching "worker".
          WORKERS=\$(/usr/sbin/drumee jlist | grep -oiE '"name":"[^"]*worker[^"]*"' | cut -d'"' -f4 | sort -u || true)
          [ -n "\$WORKERS" ] || echo "no offline workers running"
          for W in \$WORKERS; do
            /usr/sbin/drumee restart "\$W" >> $LOG_FILE 2>&1
            echo "worker \$W restarted"
          done
          EOSSH

      - name: Verify HTTP
        if: steps.target.outputs.mode == 'container'
        env:
          PORT: ${{ steps.target.outputs.port }}
          EP: ${{ steps.target.outputs.endpoint }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          sleep 5
          HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://localhost:$PORT/" || echo 000)
          echo "HTTP code: \$HTTP_CODE"
          if [[ ! "\$HTTP_CODE" =~ ^[2-4][0-9][0-9]\$ ]]; then
            echo "::error::Verify failed for endpoint $EP (5xx or unreachable)"
            exit 1
          fi
          echo "Verified endpoint $EP"
          EOSSH

      - name: Rollback (on failure)
        id: rollback_container
        if: failure() && steps.target.outputs.mode == 'container' && steps.fetch.outputs.prev != ''
        env:
          ENV_FILE: ${{ steps.target.outputs.env_file }}
          PREV: ${{ steps.fetch.outputs.prev }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -uo pipefail
          cd $REPO_PATH
          echo "::warning::Rolling back to ${PREV:0:8}"
          git reset --hard $PREV --quiet
          if npm run deploy -- $ENV_FILE > $LOG_FILE 2>&1; then
            echo "Rollback succeeded"
          else
            echo "::error::Rollback redeploy ALSO failed. Tail:"
            tail -50 $LOG_FILE
            exit 1
          fi
          EOSSH

      # ---------------- Telegram notification (all targets) ----------------
      # Skips silently when TELEGRAM_BOT_TOKEN is not set; a Telegram outage
      # never fails the deploy.
      - name: Notify Telegram
        if: always()
        env:
          TG_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TG_CHAT: ${{ secrets.TELEGRAM_CHAT_ID }}
          JOB_STATUS: ${{ job.status }}
          ROLLED_BACK: ${{ steps.rollback_stage.outcome == 'success' || steps.rollback_container.outcome == 'success' }}
          TARGET: ${{ steps.target.outputs.target }}
          BRANCH: ${{ steps.target.outputs.branch }}
          NEW_SHA: ${{ steps.stage.outputs.new || steps.fetch.outputs.new || github.sha }}
          CHANGES: ${{ steps.stage.outputs.changes || steps.fetch.outputs.changes }}
          IMPACT: ${{ steps.stage.outputs.impact || steps.fetch.outputs.impact }}
          COMMIT_MSG: ${{ github.event.head_commit.message }}
          ACTOR: ${{ github.actor }}
          REPO: ${{ github.event.repository.name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          RUN_NUM: ${{ github.run_number }}
        run: |
          [ -n "$TG_TOKEN" ] || { echo "no TELEGRAM_BOT_TOKEN secret, skip"; exit 0; }
          esc() { sed 's/&/\&amp;/g; s/</\&lt;/g; s/>/\&gt;/g'; }
          case "$JOB_STATUS" in
            success)   H="✅ DEPLOY $REPO → $TARGET — SUCCESS" ;;
            cancelled) H="⏹ DEPLOY $REPO → $TARGET — CANCELLED" ;;
            *) if [ "$ROLLED_BACK" = "true" ]; then
                 H="🔴 DEPLOY $REPO → $TARGET — FAILED (rolled back)"
               else
                 H="🔴 DEPLOY $REPO → $TARGET — FAILED"
               fi ;;
          esac
          SUBJECT=$(printf '%s' "$COMMIT_MSG" | head -n1 | esc)
          if [ -z "$SUBJECT" ]; then SUBJECT="manual dispatch"; fi
          MSG=$(printf '%s\n' "$H" "Branch: $BRANCH · ${NEW_SHA:0:8}" "$SUBJECT")
          if [ -n "$CHANGES" ]; then MSG="$MSG"$'\n'"Changes: $CHANGES"; fi
          if [ -n "$IMPACT" ];  then MSG="$MSG"$'\n'"Impact: $(printf '%s' "$IMPACT" | esc)"; fi
          MSG="$MSG"$'\n'"by $ACTOR · <a href=\"$RUN_URL\">Run #$RUN_NUM</a>"
          curl -sf --max-time 10 "https://api.telegram.org/bot${TG_TOKEN}/sendMessage" \
            -d chat_id="$TG_CHAT" -d parse_mode=HTML -d disable_web_page_preview=true \
            --data-urlencode text="$MSG" \
            && echo "telegram notification sent" \
            || echo "telegram send failed (non-blocking)"
