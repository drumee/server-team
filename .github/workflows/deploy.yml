name: CD - deploy server-team

on:
  push:
    branches: [preview, ci/setup-deploy]
  workflow_dispatch:

concurrency:
  group: cd-server-team-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: self-hosted
    timeout-minutes: 15
    outputs:
      endpoint: ${{ steps.ep.outputs.endpoint }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Resolve endpoint
        id: ep
        run: |
          if [ "${{ github.ref_name }}" = "ci/setup-deploy" ]; then
            EP="liam"
          else
            EP="main"
          fi
          echo "endpoint=$EP" >> $GITHUB_OUTPUT

      - name: Show env
        run: |
          echo "Endpoint: ${{ steps.ep.outputs.endpoint }}"
          node --version
          npm --version

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ github.repository }}-node-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

  deploy:
    name: Deploy
    needs: build
    runs-on: self-hosted
    timeout-minutes: 10
    env:
      EP: ${{ needs.build.outputs.endpoint }}
      RUNTIME_DIR: ${{ vars.DRUMEE_RUNTIME_BASE }}/server
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache node_modules
        uses: actions/cache@v4
        with:
          path: node_modules
          key: ${{ runner.os }}-${{ github.repository }}-node-${{ hashFiles('package.json') }}

      - name: Install dependencies
        run: npm install --no-audit --no-fund

      - name: Backup current state
        run: |
          sudo mkdir -p $RUNTIME_DIR
          if [ -d "$RUNTIME_DIR/$EP" ]; then
            sudo rsync -a --delete $RUNTIME_DIR/$EP/ $RUNTIME_DIR/$EP.backup/
          fi

      - name: Sync to runtime dir
        run: |
          sudo mkdir -p $RUNTIME_DIR/$EP
          sudo rsync -a --delete \
            --exclude=.git --exclude=.dev-tools.rc --exclude=.github --exclude=test --exclude=docs \
            $GITHUB_WORKSPACE/ $RUNTIME_DIR/$EP/

      - name: Restart endpoint
        run: |
          sudo /usr/sbin/drumee restart $EP > /dev/null
          sudo /usr/sbin/drumee restart $EP/service > /dev/null
          echo "Restarted endpoint"

      - name: Verify deployed package
        run: |
          server_dir=$RUNTIME_DIR/$EP
          if [ ! -f "$server_dir/index.js" ] || [ ! -f "$server_dir/service.js" ]; then
            echo "Missing entry files at $server_dir"
            exit 1
          fi
          deployed_version=$(sudo cat "$server_dir/package.json" | python3 -c "import sys,json; print(json.load(sys.stdin)['version'])")
          echo "Deployed version: $deployed_version"

      - name: Rollback on failure
        if: failure()
        run: |
          if [ -d "$RUNTIME_DIR/$EP.backup" ]; then
            echo "Rolling back to previous version..."
            sudo rsync -a --delete $RUNTIME_DIR/$EP.backup/ $RUNTIME_DIR/$EP/
            sudo /usr/sbin/drumee restart $EP > /dev/null
            sudo /usr/sbin/drumee restart $EP/service > /dev/null
            echo "Rolled back"
          else
            echo "No backup available, cannot rollback"
          fi

      - name: Cleanup
        if: always()
        continue-on-error: true
        run: sudo rm -rf $RUNTIME_DIR/$EP.backup/
