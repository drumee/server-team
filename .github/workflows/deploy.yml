name: CD - deploy server-team

on:
  push:
    branches: [preview]
  workflow_dispatch:
    inputs:
      target:
        description: 'Deploy target environment'
        type: choice
        options: [UAT, PROD]
        default: UAT

concurrency:
  group: cd-server-team-${{ github.event.inputs.target || 'UAT' }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy
    runs-on: self-hosted
    timeout-minutes: 15
    env:
      SGP_USER: debian
      SGP_HOST: sgp
      CONTAINER: drumee
      REPO_PATH: /usr/src/drumee/server-team
    steps:
      - name: Resolve target
        id: target
        run: |
          TARGET="${{ github.event.inputs.target || 'UAT' }}"
          case "$TARGET" in
            PROD) ENV_FILE=production; EP=main ;;
            UAT)  ENV_FILE=deploy;     EP=preview ;;
            *) echo "Unknown target: $TARGET"; exit 1 ;;
          esac
          echo "env_file=$ENV_FILE" >> "$GITHUB_OUTPUT"
          echo "endpoint=$EP"       >> "$GITHUB_OUTPUT"
          echo "::notice::Target $TARGET -> npm run deploy $ENV_FILE -> endpoint $EP"

      - name: Pull, deploy, verify, rollback on failure
        env:
          ENV_FILE: ${{ steps.target.outputs.env_file }}
          EP: ${{ steps.target.outputs.endpoint }}
        run: |
          ssh "$SGP_USER@$SGP_HOST" "sudo docker exec -i $CONTAINER bash -s" <<EOSSH
          set -euo pipefail
          cd $REPO_PATH

          PREV=\$(git rev-parse HEAD)
          echo ">> Previous commit: \$PREV"

          echo ">> Fetching origin/preview and hard-resetting working tree"
          git fetch origin preview
          git checkout -f preview
          git reset --hard origin/preview
          git clean -fd
          echo ">> New commit: \$(git rev-parse HEAD)"

          rollback() {
            echo ">> ROLLBACK: reverting to \$PREV"
            git reset --hard \$PREV
            npm run deploy -- $ENV_FILE || echo ">> WARNING: rollback redeploy also failed"
          }

          echo ">> Running npm run deploy $ENV_FILE"
          if ! npm run deploy -- $ENV_FILE; then
            echo ">> Deploy command failed"
            rollback || true
            exit 1
          fi

          echo ">> Waiting 5s for pm2 to stabilize..."
          sleep 5

          PORT=\$([ "$EP" = "main" ] && echo 24000 || echo 24001)
          echo ">> Verifying http://localhost:\$PORT (endpoint $EP)"
          HTTP_CODE=\$(curl -s -o /dev/null -w "%{http_code}" --max-time 10 "http://localhost:\$PORT/" || echo 000)
          echo ">> HTTP code: \$HTTP_CODE"

          if [[ ! "\$HTTP_CODE" =~ ^[2-4][0-9][0-9]\$ ]]; then
            echo ">> Verify failed (5xx or unreachable)"
            rollback || true
            exit 1
          fi

          echo ">> Deploy verified ($EP @ \$(git rev-parse --short HEAD))"
          EOSSH
